<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Мое Telegram Mini App</title>
    <!-- Официальный SDK Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #ffffff);
            --text-color: var(--tg-theme-text-color, #222222);
            --hint-color: var(--tg-theme-hint-color, #999999);
            --button-color: var(--tg-theme-button-color, #2481cc);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
            --secondary-bg-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            transition: background 0.3s, color 0.3s;
        }

        .card {
            background-color: var(--secondary-bg-color);
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        h2 {
            margin-top: 0;
            font-size: 20px;
        }

        p {
            margin: 8px 0;
            font-size: 14px;
            color: var(--text-color);
        }

        .hint {
            color: var(--hint-color);
            font-size: 12px;
        }

        .btn {
            background-color: var(--button-color);
            color: var(--button-text-color);
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            max-width: 400px;
            margin-top: 10px;
            transition: opacity 0.2s;
        }

        .btn:active {
            opacity: 0.8;
        }

        .counter-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 18px;
            font-weight: bold;
        }

        .counter-btn {
            background: var(--button-color);
            color: var(--button-text-color);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h2>🚀 Добро пожаловать!</h2>

    <!-- Карточка с данными пользователя -->
    <div class="card">
        <p><strong>Имя:</strong> <span id="user-name">Загрузка...</span></p>
        <p><strong>Username:</strong> <span id="user-username">Загрузка...</span></p>
        <p><strong>Telegram ID:</strong> <span id="user-id">Загрузка...</span></p>
    </div>

    <!-- Интерактивный элемент (счетчик) -->
    <div class="card">
        <p class="hint">Интерактивный компонент:</p>
        <div class="counter-box">
            <button class="counter-btn" onclick="changeCount(-1)">-</button>
            <span id="counter-value">0</span>
            <button class="counter-btn" onclick="changeCount(1)">+</button>
        </div>
    </div>

    <!-- Кнопка действия -->
    <button class="btn" onclick="sendDataToBot()">Сказать привет через Telegram</button>

    <script>
        // Инициализация WebApp
        const tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем на полный экран

        // Получаем информацию о пользователе из Telegram
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const user = tg.initDataUnsafe.user;
            document.getElementById('user-name').innerText = `${user.first_name} ${user.last_name || ''}`;
            document.getElementById('user-username').innerText = user.username ? `@${user.username}` : 'скрыт';
            document.getElementById('user-id').innerText = user.id;
        } else {
            document.getElementById('user-name').innerText = "Гость (открыто вне Telegram)";
            document.getElementById('user-username').innerText = "—";
            document.getElementById('user-id').innerText = "—";
        }

        // Логика счетчика с тактильным откликом (вибрацией)
        let count = 0;
        function changeCount(val) {
            count += val;
            document.getElementById('counter-value').innerText = count;
            
            // Легкая вибрация телефона при клике (если поддерживается)
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }
        }

        // Пример отправки уведомления или взаимодействия
        function sendDataToBot() {
            if (tg.HapticFeedback) {
                tg.HapticFeedback.notificationOccurred('success');
            }
            tg.showAlert(`Кнопка нажата! Значение счетчика: ${count}`);
        }
    </script>
</body>
</html>
